<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https:;">
<title>Weather Now</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="eng-skip" href="#eng-main">Skip to content</a>
<div id="eng-app">
<main id="eng-main">
<section class="eng-page" data-page="home" id="page-home" aria-label="Home">
<h1 data-eng-node="eng-1">Weather Now</h1>
<div data-eng-node="eng-2" class="eng-row"><div class="eng-field"><label for="eng-3">Latitude</label><input id="eng-3" type="text" placeholder="For example 52.52" data-eng-node="eng-3" data-eng-id="latitude" id="latitude"></div>
<div class="eng-field"><label for="eng-4">Longitude</label><input id="eng-4" type="text" placeholder="For example 13.41" data-eng-node="eng-4" data-eng-id="longitude" id="longitude"></div>
<button type="button" data-eng-node="eng-5" data-eng-id="check button" class="eng-button">Check</button></div>
<div data-eng-node="eng-6" class="eng-card"><h2 data-eng-node="eng-7">Current weather</h2>
<span data-eng-node="eng-8" data-eng-id="result" id="result" class="eng-text">Press Check to begin.</span></div>
</section>
</main>
</div>
<script type="module" src="app.js"></script>

</body>
</html>
